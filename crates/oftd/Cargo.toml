[package]
name = "oftd"
description = "OFT Timer for Linux: serves the OFT Protocol over HTTP + WebSocket for one or more Nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oftd"
path = "src/main.rs"

[dependencies]
oft-nodelink.workspace = true
oft-core.workspace = true
oft-sim.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serialport = { version = "4", default-features = false }
mdns-sd = { version = "0.21", default-features = false }

[dev-dependencies]
mdns-sd = "0.21"
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
