[workspace]
resolver = "2"
members = ["crates/oft-nodelink", "crates/oft-core", "crates/oft-sim"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/open-fpv-timer/oft"
rust-version = "1.80"

[workspace.dependencies]
oft-nodelink = { path = "crates/oft-nodelink" }
oft-core = { path = "crates/oft-core" }
